[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chatbot-helper"
version = "0.1.0"
description = "Prepare focused Python project context for browser-based coding chats."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pathspec>=0.12.1,<2",
    "rich>=13.9,<15",
]

[project.urls]
Repository = "https://github.com/EllisSK/ChatbotHelper"

[project.scripts]
chatbot-helper = "chatbot_helper.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
